name: "vau-release"

# Збирає android-tailscaled цього форку і публікує ПІДПИСАНИЙ реліз.
#
# Кожен сторонній action прибитий до SHA коміту, а не до тегу: тег можна
# пересунути на інший код, а цей workflow збирає бінарник, який потім працює
# як root на телефоні. Action'и NDK та UPX прибрано зовсім — збірка без CGO
# (NDK не потрібен), а UPX лише роздуває RSS на телефоні, який і так упирається
# в LOW_MEMORY (див. docs/vau/AUDIT.md, M10).
#
# Лише arm64. Порт Go android/arm (32-біт) не лінкується без cgo —
# «android/arm requires external (cgo) linking, but cgo is not enabled» — тож
# 32-бітна збірка означала б тягнути NDK назад заради архітектури, якої немає
# на жодному цільовому пристрої (обидва телефони aarch64).

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Позначити реліз як pre-release"
        type: boolean
        default: false
  push:
    tags:
      - "v*-vau*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign

      - name: Гейт — самооновлювач не має потрапити в збірку
        run: |
          set -euo pipefail
          # Feature-тег `clientupdate` — це те, що кладе `tailscale update` у
          # бінарник: він завантажує tailscaled зі стороннього репозиторію без
          # підпису і ставить його 0777 (docs/vau/AUDIT.md, C1). Якщо хтось
          # прибере його зі списку remove, реліз має впасти тут, а не на телефоні.
          # Прив'язано до присвоєння `remove=`: голий grep збігся б і з
          # коментарем над ним і пройшов би без тегу.
          grep -qE '^\s*local remove=".*\bclientupdate\b' scripts/android.sh
          echo "ok: clientupdate є у списку remove"
          # І сирці Android-самооновлювача теж не мають повернутись: їх
          # відсікає лише `//go:build android`, тож щойно якийсь файл їх
          # імпортує — шлях встановлення з 0777 знову в бінарнику.
          if ls clientupdate/clientupdate_android.go clientupdate/clientupdate_notandroid.go 2>/dev/null | grep -q .; then
            echo "clientupdate/clientupdate_android.go знову в дереві" >&2
            exit 1
          fi
          echo "ok: сирців android-самооновлювача немає"

      - name: Build arm64 (no cgo)
        run: ./scripts/android.sh build --nocgo arm64

      - name: Package binary, KSU module and checksums
        run: |
          set -euo pipefail
          eval "$(./build_dist.sh shellvars)"
          # versionCode має лише зростати, не залежати від того, як клоновано
          # репозиторій, і відрізнятися для двох збірок, зроблених близько в
          # часі. Кількість комітів провалює другу вимогу (shallow clone: 20,
          # повна історія: 10631). yymmddHH провалив третю — дві збірки за одну
          # годину дали однакове число, і телефон відмовив новішій як «не
          # новіша». Хвилини від 2026-01-01 задовольняють усі три і лишаються
          # шестизначними десятиліттями, далеко в межах int32.
          VAU_N=$(( ( $(date -u +%s) - 1767225600 ) / 60 ))
          MOD_VERSION="v${VERSION_SHORT}-vau${VAU_N}"
          TAG="v${VERSION_SHORT}-vau"
          echo "VERSION_SHORT=$VERSION_SHORT" >> "$GITHUB_ENV"
          echo "MOD_VERSION=$MOD_VERSION" >> "$GITHUB_ENV"

          cd dist
          tar -czf "tailscale_${VERSION_SHORT}_arm64.tgz" --transform='s/tailscaled.arm64/tailscaled/' tailscaled.arm64
          cd ..

          # KSU-модуль несе бінарник усередині zip, тож свіже встановлення
          # працює офлайн, а оновлення — це один файл, який треба отримати й
          # перевірити. Встановлювач переносить його в /data/adb/tailscale і
          # прибирає з каталогу модуля, тож на пристрої лишається одна копія.
          rm -rf dist/module
          mkdir -p dist/module/bin
          cp module/module.prop module/service.sh module/uninstall.sh \
             module/action.sh module/customize.sh module/update.sh \
             module/skip_mount dist/module/
          cp -r module/webroot dist/module/
          cp dist/tailscaled.arm64 dist/module/bin/tailscaled
          # versionCode лише зростає — VAU_N робить це без файлу, який хтось
          # має пам'ятати підняти.
          sed -i "s/^version=.*/version=${MOD_VERSION}/" dist/module/module.prop
          sed -i "s/^versionCode=.*/versionCode=${VAU_N}/" dist/module/module.prop
          ZIP="vau-tailscale-${MOD_VERSION}.zip"
          (cd dist/module && zip -qX -r "../${ZIP}" .)
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

          printf '%s\n' \
            '{' \
            "  \"version\": \"${MOD_VERSION}\"," \
            "  \"versionCode\": ${VAU_N}," \
            "  \"zipUrl\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${ZIP}\"," \
            "  \"changelog\": \"https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/CHANGELOG.txt\"" \
            '}' > dist/update.json

          printf '%s\n' "Vau Tailscale ${MOD_VERSION}" \
            "tailscale commit: ${GITHUB_SHA}" \
            "build: $(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/CHANGELOG.txt

          # Контрольні суми покривають усе, що йде в реліз, і рахуються ДО
          # підписання, щоб підпис покривав той самий набір. SHA256SUMS, у якому
          # згадано файли, що не є asset'ами релізу, ламає `sha256sum -c` усім,
          # хто його завантажує.
          cd dist
          sha256sum tailscale_*.tgz "$ZIP" update.json CHANGELOG.txt > SHA256SUMS
          ls -lh

      - name: Sign artifacts
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: ./scripts/sign.sh dist/tailscale_*.tgz dist/SHA256SUMS

      - name: Verify the signatures with the published public key
        run: |
          set -euo pipefail
          # Доводить, що реліз перевіряється ключем, який людям кажуть
          # використовувати, а не просто тим, яким CI випадково підписав.
          PUB=$(grep -m1 '^RW' docs/BUILD.md)
          for sig in dist/*.minisig; do
            minisign -Vm "${sig%.minisig}" -P "$PUB"
          done

      - name: Drop module zips left by earlier builds
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-vau', env.VERSION_SHORT) }}
        run: |
          set -euo pipefail
          # Тег релізу перевикористовується, а action завантаження лише ДОДАЄ
          # файли, тож zip попередньої збірки лишається прикріпленим — уже не
          # покритий поточним SHA256SUMS, але досі встановлюваний для будь-кого,
          # хто прогорне список asset'ів. Прибираємо кожен zip модуля, крім
          # щойно зібраного.
          if gh release view "$TAG" --json assets --jq '.assets[].name' > /tmp/assets.txt 2>/dev/null; then
            grep '^vau-tailscale-.*\.zip$' /tmp/assets.txt | grep -v -x -F "$ZIP" \
              | while read -r a; do
                  echo "видаляю застарілий asset: $a"
                  gh release delete-asset "$TAG" "$a" -y || true
                done
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}-vau', env.VERSION_SHORT) }}
          prerelease: ${{ inputs.prerelease == true }}
          generate_release_notes: true
          files: |
            dist/*.tgz
            dist/*.zip
            dist/update.json
            dist/CHANGELOG.txt
            dist/*.minisig
            dist/SHA256SUMS
